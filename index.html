<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalanche Risk Assessment Checklist</title>
</head>
<body>
    <h1>Avalanche Risk Assessment Checklist</h1>
    <form>
        <h2>Weather Conditions</h2>
        <label for="temperature">Temperature:</label>
        <input type="text" id="temperature" name="temperature"><br>
        <label for="snowfall">Recent Snowfall:</label>
        <input type="text" id="snowfall" name="snowfall"><br>
        <label for="wind">Wind Conditions:</label>
        <input type="text" id="wind" name="wind"><br>

        <h2>Snowpack Stability</h2>
        <label for="layers">Layers in Snowpack:</label>
        <input type="text" id="layers" name="layers"><br>
        <label for="cracking">Signs of Cracking or Collapse:</label>
        <input type="text" id="cracking" name="cracking"><br>

        <h2>Avalanche Observations</h2>
        <label for="recent_avalanche">Recent Avalanches:</label>
        <input type="text" id="recent_avalanche" name="recent_avalanche"><br>
        <label for="human_trigger">Possible Human Trigger:</label>
        <input type="text" id="human_trigger" name="human_trigger"><br>

        <h2>Personal Assessment</h2>
        <label for="risk_level">Personal Risk Level Assessment:</label>
        <input type="text" id="risk_level" name="risk_level"><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
