<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Checklist Avalanchas - Árbol de Decisión</title>
<style>
body { font-family: Arial; background:#f0f2f5; padding:40px; }
.card {
    background:white;
    padding:25px;
    border-radius:10px;
    max-width:800px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
h2 { margin-top:0; }
button {
    padding:10px 15px;
    margin:10px 10px 0 0;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.yes { background:#2e7d32; color:white; }
.no { background:#c62828; color:white; }
.result { margin-top:20px; font-weight:bold; font-size:1.1em; }
.summary {
    margin-top:20px;
    background:#eef3f7;
    padding:15px;
    border-radius:8px;
    font-size:0.95em;
}
.info {
    font-size:0.9em;
    margin-top:10px;
    background:#f7f7f7;
    padding:10px;
    border-radius:6px;
}
</style>
</head>
<body>

<div class="card">
<h2>Checklist previo a salida en zona de avalanchas</h2>

<div id="question"></div>
<div id="info" class="info"></div>
<div id="buttons"></div>
<div id="result" class="result"></div>
<div id="summary" class="summary"></div>
</div>

<script>

let currentStep = 0;
let riskPoints = 0;
let answers = [];

// Árbol de decisión tipo checklist profesional
const steps = [

{
q: "¿Has consultado el BPA correcto y vigente para tu zona?",
info: "IGCC, AEMET o fuente oficial. Vigencia temporal y cobertura geográfica.",
yes: {next:1, risk:0}, 
no: {end:"No salir hasta consultar BPA."}
},

{
q: "¿Comprendes problema principal, orientaciones y cota crítica?",
info: "Necesitas interpretar el boletín para tu itinerario y hora de paso.",
yes: {next:2, risk:0},
no: {end:"Revisa BPA antes de salir."}
},

{
q: "¿El itinerario pasa por pendientes ≥30º?",
info: "La mayoría de avalanchas ocurren en 30–45º.",
yes: {next:3, risk:2},
no: {next:3, risk:0}
},

{
q: "¿Coincide orientación del itinerario con orientación crítica del BPA?",
info: "Si coincide, el riesgo aumenta.",
yes: {next:4, risk:2},
no: {next:4, risk:0}
},

{
q: "¿La altitud máxima del itinerario entra en franja crítica del BPA?",
info: "Altitud y hora de paso importan para la estabilidad.",
yes: {next:5, risk:2},
no: {next:5, risk:0}
},

{
q: "¿Existen convexidades, canales, barrancos u otros terrenos trampa?",
info: "Aumentan consecuencia de un alud.",
yes: {next:6, risk:3},
no: {next:6, risk:0}
},

{
q: "¿Ha caído nieve nueva en últimas 12h o se prevé durante la salida?",
info: "La nieve reciente no se une bien con la capa anterior y puede deslizarse fácilmente, incluso sobre una base estable.",
yes: {next:7, risk:2},
no: {next:7, risk:0}
},

{
q: "¿Hay viento fuerte que pueda transportar nieve?",
info: "El viento genera placas y zonas inestables en sotavento.",
yes: {next:8, risk:2},
no: {next:8, risk:0}
},

{
q: "¿La visibilidad permite evaluar correctamente el terreno?",
info: "Mala visibilidad dificulta detección de señales de riesgo.",
yes: {next:9, risk:0},
no: {next:9, risk:1}
},

{
q: "¿Tienes Plan B o escapatorias para reducir exposición?",
info: "Alternativas seguras permiten minimizar riesgo durante la salida.",
yes: {end:"evaluate"},
no: {end:"Define Plan B antes de salir."}
}

];

function showStep(i){
    const step = steps[i];
    document.getElementById("question").textContent = step.q;
    document.getElementById("info").textContent = step.info;
    document.getElementById("buttons").innerHTML = "";

    createButton("Sí","yes",()=>handleAnswer(step.q,"Sí",step.yes));
    createButton("No","no",()=>handleAnswer(step.q,"No",step.no));
}

function createButton(text,cls,fn){
    const btn = document.createElement("button");
    btn.textContent = text;
    btn.className = cls;
    btn.onclick = fn;
    document.getElementById("buttons").appendChild(btn);
}

function handleAnswer(question,response,action){
    answers.push({question, response});
    if(action.risk) riskPoints += action.risk;

    if(action.next !== undefined){
        currentStep = action.next;
        showStep(currentStep);
        return;
    }

    if(action.end === "evaluate"){ 
        evaluateFinal();
        return;
    }

    if(action.end){
        finish(action.end,"warning");
    }
}

function evaluateFinal(){
    let message="";
    let style="";

    if(riskPoints>=14){
        message="Riesgo muy alto: replantea salida o busca alternativa.";
        style="warning";
    }
    else if(riskPoints>=9){
        message="Riesgo alto: itinerario conservador recomendado.";
        style="warning";
    }
    else if(riskPoints>=5){
        message="Riesgo moderado: precaución y seguimiento continuo.";
        style="medium";
    }
    else{
        message="Condiciones favorables: salida coherente con BPA.";
        style="safe";
    }

    finish(message,style);
}

function finish(msg,style){
    document.getElementById("question").textContent = "Resultado:";
    document.getElementById("info").textContent = "";
    document.getElementById("buttons").innerHTML = "";

    document.getElementById("result").className = "result "+style;
    document.getElementById("result").textContent = msg;

    let summaryHTML = "<strong>Resumen de decisiones:</strong><br><br>";
    summaryHTML += "Riesgo acumulado: "+riskPoints+"<br><br>";
    answers.forEach(a=>{
        summaryHTML += "• "+a.question+" → "+a.response+"<br>";
    });
    document.getElementById("summary").innerHTML = summaryHTML;
}

// Iniciar árbol
showStep(currentStep);

</script>

</body>
</html>
